name: Deploy Markdown Explainer to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "applications/markdown-explainer/**"
      - "article-summaries/**"
      - "news/**"
      - "note/**"
      - "reading/**"
      - "researches/**"
      - "self-articles/**"
      - ".github/workflows/markdown-explainer-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: applications/markdown-explainer/package-lock.json
      - name: Install dependencies
        working-directory: applications/markdown-explainer
        run: npm ci
      - name: Build Pages artifact
        working-directory: applications/markdown-explainer
        run: npm run check
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: applications/markdown-explainer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
